name: GPU

# CUDA and ROCm builds/tests on simulated GPUs (https://github.com/pantheongpu/pantheonsim), on
#  GitHub's standard runners. Slow: run on merges to master and on demand, not on pull requests.
#  Modelled on PHARE's tiling_gpu build.yml (cuda fast / rocm jobs).
#  In ghcr.io/0xz/hpc-containers' cuda / rocm images (latest; pin to :<flavor>-<sha> if one breaks): the toolkit, PantheonSim (vgpu, its
#  shared cudart shim), Open MPI built for the GPU and parallel HDF5 (subfiling) in /opt

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# the containers run as root: Open MPI refuses unless allowed, for every mpirun
env:
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

jobs:
  # CUDA on a simulated NVIDIA H100, clang (the image's nvcc is not used). The simulator needs a
  #  shared cudart, the profiles link -lcudart (the .so) from its shim.
  #  sm_90 (H100): res/mkn/clang_cuda.yaml targets sm_120.
  cuda:
    name: cuda (clang 22, CUDA 13.5, simulated H100)
    runs-on: ubuntu-24.04
    container: ghcr.io/0xz/hpc-containers:cuda
    timeout-minutes: 120
    env:
      CUDA_ARCH: sm_90
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: |
        # clang 22 (apt.llvm.org): clang 21, Ubuntu 26.04's, cannot compile CUDA 13's headers
        apt-get update && apt-get install -y curl wget gnupg lsb-release software-properties-common libnuma-dev
        curl -fsSLo llvm.sh https://apt.llvm.org/llvm.sh && bash llvm.sh 22
        ln -sf /usr/bin/clang-22 /usr/local/bin/clang
        ln -sf /usr/bin/clang++-22 /usr/local/bin/clang++
        clang++ --version
    - name: mkn profiles for this GPU
      run: |
        # not `command -v nvcc`: that is pantheonsim's drop-in, in its build dir
        CUDA_HOME=$(readlink -f /usr/local/cuda)
        sed -e "s/cuda.arch: 120/cuda.arch: ${CUDA_ARCH#sm_}/" -e "s|/usr/local/cuda|${CUDA_HOME}|g" \
          res/mkn/clang_cuda.yaml > res/mkn/clang_cuda_ci.yaml
        # include/cccl (thrust, cub) only from CUDA 13, before they are in include/: mkn rejects a
        #  missing include directory
        [ -d "${CUDA_HOME}/targets/x86_64-linux/include/cccl" ] \
          || sed -i '\|targets/x86_64-linux/include/cccl|d' res/mkn/clang_cuda_ci.yaml
        # link the simulator's shared cudart, not the toolkit's: mkn puts the profile's lib path on
        #  LD_LIBRARY_PATH for test runs, and the toolkit's cudart cannot run on the simulated driver
        sed -i "s|^path: .*|path: ${VGPU_SHIM_DIR}|" res/mkn/clang_cuda_ci.yaml
        grep -n "^path:\|cuda.arch" res/mkn/clang_cuda_ci.yaml
        sed -e "s/^super: clang_cuda$/super: clang_cuda_ci/" \
          res/mkn/clang_cuda_mpi.yaml > res/mkn/clang_cuda_mpi_ci.yaml
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o mkn https://github.com/mkn/mkn/releases/latest/download/mkn_nix
        chmod +x mkn && mv mkn /usr/local/bin/mkn
    - name: Build/Test core
      run: |
        KLOG=3 vgpu run mkn clean build test -dtKOqp test_damn_core -x res/mkn/clang_cuda_ci
    - name: Build/Test mpi
      run: |
        KLOG=3 vgpu run mkn clean build test -dtKOqp test_damn_mpi -x res/mkn/clang_cuda_mpi_ci
        vgpu run mpirun --oversubscribe -n 2 bin/test_damn_mpi/test/*_test_mpi_utils.cpp
    - name: Build/Test hdf5
      run: |
        KLOG=3 vgpu run mkn clean build test -dtKOqp test_damn_hdf5 -x res/mkn/clang_cuda_mpi_ci
        vgpu run mpirun --oversubscribe -n 2 bin/test_damn_hdf5/test/*_test_h5_file.cpp

  # ROCm on a simulated AMD MI300X (gfx942), hipcc and rocThrust from the image's ROCm
  #  (res/mkn/hip_thrust.yaml, thrust is used only if its headers are found)
  rocm:
    name: rocm (hipcc, ROCm 7.14, simulated MI300X)
    runs-on: ubuntu-24.04
    container: ghcr.io/0xz/hpc-containers:rocm
    timeout-minutes: 120
    steps:
    - uses: actions/checkout@v6
    - name: Install
      run: |
        apt-get update && apt-get install -y curl
        hipcc --version
        ls /opt/rocm/include/thrust/sort.h || echo "::warning::no rocThrust, building without thrust"
    - name: mkn profiles for this GPU
      run: |
        sed -e "s/-DMKN_GPU_CUDA=0/-DMKN_GPU_CUDA=0 --offload-arch=gfx942/" \
          res/mkn/hip_thrust.yaml > res/mkn/hip_thrust_ci.yaml
        sed -e "s/^super: hip_thrust$/super: hip_thrust_ci/" \
          res/mkn/hip_thrust_mpi.yaml > res/mkn/hip_thrust_mpi_ci.yaml
        # the hip profiles' local (/mkn/r) and remote (git@github.com, SSH) repositories are a
        #  developer's: CI uses mkn's defaults (~/.maiken/repo, https)
        sed -i -e '/^local:/,+2d' -e '/^remote:/,+2d' res/mkn/hip_thrust_ci.yaml
        cat res/mkn/hip_thrust_ci.yaml
        curl -fsSL --retry 5 --retry-delay 2 --retry-all-errors -o mkn https://github.com/mkn/mkn/releases/latest/download/mkn_nix
        chmod +x mkn && mv mkn /usr/local/bin/mkn
    - name: Build/Test core
      run: |
        KLOG=3 vgpu run mkn clean build test -dtKOqp test_damn_core -x res/mkn/hip_thrust_ci
    - name: Build/Test mpi
      run: |
        KLOG=3 vgpu run mkn clean build test -dtKOqp test_damn_mpi -x res/mkn/hip_thrust_mpi_ci
        vgpu run mpirun --oversubscribe -n 2 bin/test_damn_mpi/test/*_test_mpi_utils.cpp
    - name: Build/Test hdf5
      run: |
        KLOG=3 vgpu run mkn clean build test -dtKOqp test_damn_hdf5 -x res/mkn/hip_thrust_mpi_ci
        vgpu run mpirun --oversubscribe -n 2 bin/test_damn_hdf5/test/*_test_h5_file.cpp
