name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04

    steps:
    - uses: actions/checkout@v4

    - run: |
        apt update && apt install -y curl
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn clean build test -dtKOqp test_damn_core -Wx res/mkn/mpi
        KLOG=3 ./mkn clean build test -dtKOqp test_damn_mpi -Wx res/mkn/mpi
        mpirun --allow-run-as-root --oversubscribe -n 2 bin/test_damn_mpi/test/*_test_mpi_utils.cpp
        KLOG=3 ./mkn clean build test -dtKOqp test_damn_hdf5 -Wx res/mkn/mpi
        mpirun --allow-run-as-root --oversubscribe -n 2 bin/test_damn_hdf5/test/*_test_h5_file.cpp
