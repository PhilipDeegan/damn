name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

# the containers run as root: Open MPI refuses unless allowed, for every mpirun
env:
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
  CURL_GET: curl -fL --retry 3 --retry-delay 2
  PATH_GET: https://github.com/mkn/mkn/releases/latest/download

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04
    timeout-minutes: 60 # a rank throwing while the others wait in a collective hangs to the 6 h limit

    steps:
    - uses: actions/checkout@v4

    - run: |
        apt update && apt install -y curl ccache
        $CURL_GET -o mkn $PATH_GET/mkn_nix
        chmod +x mkn
        # build builds the test executables (bin/<profile>/test), phlop runs them below
        for p in test_damn_core test_damn_mpi test_damn_hdf5; do
          KLOG=3 ./mkn clean build -dtKOqp $p -W 9 -a "-Wno-unused-parameter -Wno-unused-variable -Wno-error=strict-aliasing" -x res/mkn/mpi
        done

    # tst/.phlop.exec.yaml: each test once, the mpi ones on 1 rank and most on 2, 3 and 8 (-c 8:
    #  an 8 rank job, oversubscribed, runs alone); a failing test's output kept under .phlop/
    - run: |
        for venv in /.venv /root/.venv; do [ -x $venv/bin/python3 ] && export PATH=$venv/bin:$PATH && break; done
        python3 -m pip install "phlop[psutil]>=0.1.1"
        python3 -m phlop.run.test_cases -i tst -c 8 --tags mpi
    - if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: phlop-logs
        path: .phlop/
        include-hidden-files: true
        if-no-files-found: ignore
