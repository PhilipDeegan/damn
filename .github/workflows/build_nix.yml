name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

# the containers run as root: Open MPI refuses unless allowed, for every mpirun
env:
  OMPI_ALLOW_RUN_AS_ROOT: 1
  OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04

    steps:
    - uses: actions/checkout@v4

    - run: |
        apt update && apt install -y curl
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn clean build test -dtKOqp test_damn_core -Wx res/mkn/mpi
        KLOG=3 ./mkn clean build test -dtKOqp test_damn_mpi -Wx res/mkn/mpi
        mpirun --oversubscribe -n 2 bin/test_damn_mpi/test/*_test_mpi_utils.cpp
        # copies and regrids between ranks: 3 ranks share 6 patches unevenly, 8 leave two ranks without one
        for n in 2 3 8; do
          mpirun --oversubscribe -n $n bin/test_damn_mpi/test/*_test_mpi_copy.cpp
          mpirun --oversubscribe -n $n bin/test_damn_mpi/test/*_test_mpi_regrid.cpp
          mpirun --oversubscribe -n $n bin/test_damn_mpi/test/*_test_mpi_inter_level.cpp
          mpirun --oversubscribe -n $n bin/test_damn_mpi/test/*_test_mpi_clustering.cpp
          mpirun --oversubscribe -n $n bin/test_damn_mpi/test/*_test_mpi_scope_timing.cpp
        done
        KLOG=3 ./mkn clean build test -dtKOqp test_damn_hdf5 -Wx res/mkn/mpi
        mpirun --oversubscribe -n 2 bin/test_damn_hdf5/test/*_test_h5_file.cpp
