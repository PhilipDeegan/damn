property:
  cxx.flags: --std=c++20 -fPIC -fsized-deallocation
  lnk.flags: -Wl,-z,defs -fuse-ld=gold 
local:
  repo: /mkn/r
  mod-repo: /mkn/m
remote:
  repo: git@github.com:mkn/
  mod-repo: git@github.com:mkn-mod/
env: | # a versioned clang, e.g. OMPI_CXX=clang++-22
  OMPI_CXX=clang++
  PATH=/opt/mpi/cuda/bin:${PATH}
compiler:
  mask:
    g++:
      mpicxx
file:
  - type: cpp:cxx:cc
    archiver: llvm-ar -cr # clang's (GNU ar cannot index its LTO bitcode), e.g. llvm-ar-22 with clang++-22
    compiler:  mpicxx -DOMPI_SKIP_MPICXX -DMPICH_SKIP_MPICXX ${cxx.flags} 
    linker:  mpicxx ${lnk.both}
