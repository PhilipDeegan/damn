super: hip_thrust

# compiled and linked through mpicxx (openmpi, OMPI_CXX=hipcc)

env: |
  OMPI_CXX=hipcc
  PATH=/opt/rocm/bin:${PATH}

compiler:
  mask:
    g++:
      mpicxx

file:
  - type: cpp:cxx:cc:c:S
    archiver: ar -cr
    compiler: mpicxx -DOMPI_SKIP_MPICXX -DMPICH_SKIP_MPICXX ${cxx.flags}
    linker: mpicxx ${lnk.flags}
