#! clean build test -p test_damn_core -dKO -t 8

name: damn

profile:

# subprojects are fetched along the profile/parent chain, before sources are checked
- name: base
  inc: inc
       tpp/bto/include
       tpp/phlop/inc
  sub: bto&tpp/bto(https://github.com/bshoshany/thread-pool)
       phlop#next&tpp/phlop(https://github.com/PhilipDeegan/phlop)
  dep: mkn.kul mkn.gpu
  arg: -std=c++20

- name: damn_core
  parent: base
  src: tpp/phlop/src/phlop/timing/scope_timer.cpp
  out: damn_core

# needs an MPI compiler, e.g. -x res/mkn/mpi
- name: damn_mpi
  parent: base
  src: src/damn/mpi
  out: damn_mpi

- name: test_damn_mpi
  inc: .
  self: damn_mpi
  dep: google.test
  mode: none
  test: tst/damn/mpi/test_mpi_utils.cpp

- name: test_damn_core
  inc: .
  self: damn_core
  dep: google.test
  mode: none
  test: tst/damn/core/test_damn_core.cpp
        tst/damn/amr/test_hierarchy.cpp
        tst/damn/amr/test_level_data.cpp
        tst/damn/amr/test_schedule.cpp

# include-what-you-use report for inc/, needs iwyu on PATH
- name: iwyu
  parent: base
  mode: none
  mod:
  - name: cpp.iwyu
    compile:
      paths: inc
      headers: -x c++-header
