#! clean build test -p test_damn_core -dKO -t 8

name: damn

profile:

# subprojects are fetched along the profile/parent chain, before sources are checked
- name: base
  inc: inc
       tpp/bto/include
       tpp/phlop/inc
  sub: bto&tpp/bto(https://github.com/bshoshany/thread-pool)
       phlop#next&tpp/phlop(https://github.com/PhilipDeegan/phlop)
  dep: mkn.kul mkn.gpu
  arg: -std=c++20

- name: damn_core
  parent: base
  src: tpp/phlop/src/phlop/timing/scope_timer.cpp
  out: damn_core

# needs an MPI compiler, e.g. -x res/mkn/mpi
- name: damn_mpi
  parent: base
  src: src/damn/mpi
  out: damn_mpi

- name: test_damn_mpi
  inc: .
  self: damn_mpi
  dep: google.test
  mode: none
  test: tst/damn/mpi/test_mpi_utils.cpp

# HDF5 through HighFive (header only, fetched), over damn_mpi: needs an MPI compiler and a
# parallel HDF5 the settings can find, e.g. -x res/mkn/mpi
- name: damn_hdf5
  parent: base
  self: damn_mpi
  sub: highfive#v3.0.0-beta2&tpp/highfive(https://github.com/highfive-devs/highfive)
  inc: tpp/highfive/include
  lib: hdf5

- name: test_damn_hdf5
  inc: .
  self: damn_hdf5
  dep: google.test
  mode: none
  test: tst/damn/hdf5/test_h5_file.cpp

- name: test_damn_core
  inc: .
  self: damn_core
  dep: google.test
  mode: none
  test: tst/damn/core/test_damn_core.cpp
