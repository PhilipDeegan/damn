#! clean build test -p test_damn_core -dKO -t 8 -x res/mkn/thrust

name: damn
property:
  # dependency versions: master (HEAD), not the default branch's rolling release (mkn.kul's: latest)
  mkn.kul.version: master
  mkn.gpu.version: master
  clang.tidy.version: master
  cpp.iwyu.version: master

profile:

# subprojects are fetched along the profile/parent chain, before sources are checked
# cccl: thrust (zip iterators, partition, sort, scan) on the host too, see
#  damn/core/def/detail/thrust.hpp; the version of the CUDA toolkit's. Cloned here, included only
#  by CPU settings (cpu.thrust in res/mkn/base.yaml: mpi, hpc, thrust), so GPU builds see their
#  toolkit's thrust alone
- name: base
  inc: inc
       tpp/bto/include
       tpp/phlop/inc
  sub: bto&tpp/bto(https://github.com/bshoshany/thread-pool)
       phlop#next&tpp/phlop(https://github.com/PhilipDeegan/phlop)
       cccl#v3.5.0&tpp/cccl(https://github.com/NVIDIA/cccl)
  dep: mkn.kul#${mkn.kul.version} mkn.gpu#${mkn.gpu.version}
  # nothing reads errno: sqrt, pow ... stay inline, their loops vectorise (results unchanged)
  arg: -std=c++20 -fno-math-errno

- name: damn_core
  parent: base
  src: tpp/phlop/src/phlop/timing/scope_timer.cpp
  out: damn_core

# needs an MPI compiler, e.g. -x res/mkn/mpi
- name: damn_mpi
  parent: base
  self: damn_core # phlop's scope timer instances, for the scopes in damn's MPI headers
  src: src/damn/mpi
  out: damn_mpi

- name: test_damn_mpi
  inc: .
  self: damn_mpi
  dep: google.test
  mode: none
  test: tst/damn/mpi/test_mpi_utils.cpp
        tst/damn/mpi/test_mpi_copy.cpp
        tst/damn/mpi/test_mpi_regrid.cpp
        tst/damn/mpi/test_mpi_inter_level.cpp
        tst/damn/mpi/test_mpi_clustering.cpp
        tst/damn/mpi/test_mpi_scope_timing.cpp

# HDF5 through HighFive v3.3.0 (header only, fetched), over damn_mpi: needs an MPI compiler and a
# parallel HDF5 the settings can find, e.g. -x res/mkn/mpi
- name: damn_hdf5
  parent: base
  self: damn_mpi
  sub: highfive#v3.3.0&tpp/highfive(https://github.com/highfive-devs/highfive)
  inc: tpp/highfive/include
  lib: hdf5

# etc/bootstrap's probes, built one at a time by etc/bootstrap/bootstrap.py (-M <probe>):
# the build's compilers, flags and find paths, nothing of damn's. bootstrap_hdf5: links HDF5
- name: bootstrap
  arg: -std=c++20

- name: bootstrap_hdf5
  parent: bootstrap
  lib: hdf5

- name: test_damn_hdf5
  inc: .
  self: damn_hdf5
  dep: google.test
  mode: none
  test: tst/damn/hdf5/test_h5_file.cpp
        tst/damn/hdf5/test_level_table.cpp
        tst/damn/hdf5/test_checkpoint.cpp
        tst/damn/hdf5/test_vtkhdf.cpp

- name: test_damn_core
  inc: .
  self: damn_core
  dep: google.test
  mode: none
  test: tst/damn/core/test_damn_core.cpp
        tst/damn/amr/test_hierarchy.cpp
        tst/damn/amr/test_level_data.cpp
        tst/damn/amr/test_copy.cpp
        tst/damn/amr/test_partition.cpp
        tst/damn/amr/test_keep_partition.cpp
        tst/damn/amr/test_decompose.cpp
        tst/damn/amr/test_estimate.cpp
        tst/damn/amr/test_regrid.cpp
        tst/damn/amr/test_inter_level.cpp
        tst/damn/amr/test_inter_level_ratio3.cpp
        tst/damn/amr/test_clustering.cpp
        tst/damn/amr/test_metrics.cpp
        tst/damn/amr/test_physical_boundary.cpp
        tst/damn/amr/test_time_refinement.cpp
        tst/damn/core/exec/test_thread_pool.cpp
        tst/damn/core/exec/test_thread_pool_sync.cpp
        tst/damn/core/exec/test_execution_model.cpp

# clang-tidy report (.clang-tidy) over the core tests and the damn headers they include, needs
# clang-tidy on PATH
- name: tidy
  parent: test_damn_core
  mod:
  - name: clang.tidy
    version: ${clang.tidy.version}

# include-what-you-use report for inc/, needs iwyu on PATH
- name: iwyu
  parent: damn_hdf5 # base, MPI, HighFive and HDF5: every header parses
  mode: none
  mod:
  - name: cpp.iwyu
    version: ${cpp.iwyu.version}
    compile:
      paths: inc
      headers: -x c++-header
      # namespace a::b in forward declarations, damn's include mappings
      # without thrust, as before host thrust: iwyu would map thrust's and libcudacxx's internals
      args: -DDAMN_HAVE_THRUST=0 -Xiwyu --cxx17ns -Xiwyu --mapping_file=res/iwyu.imp

# iwyu's suggestions applied (fix_include): CI builds this and fails on any resulting diff
# mpicxx adds MPI's include directories itself, iwyu needs them given (Debian/Ubuntu openmpi)
- name: iwyu_fix
  parent: damn_hdf5 # base, MPI, HighFive and HDF5: every header parses
  mode: none
  mod:
  - name: cpp.iwyu
    version: ${cpp.iwyu.version}
    compile:
      paths: inc
      # fragments of damn/core/exec/kernels.hpp, not standalone headers
      ignore: kernels/detail/mkn_launchers.hpp
      inc: /usr/lib/x86_64-linux-gnu/openmpi/include /usr/lib/x86_64-linux-gnu/openmpi/include/openmpi
      headers: -x c++-header
      # namespace a::b in forward declarations, damn's include mappings
      # without thrust, as before host thrust: iwyu would map thrust's and libcudacxx's internals
      args: -DDAMN_HAVE_THRUST=0 -Xiwyu --cxx17ns -Xiwyu --mapping_file=res/iwyu.imp
      # --noreorder keeps the include order (damn, other, system), --nosafe_headers lets it
      # remove unused includes from headers too
      fix: --nocomments --noreorder --nosafe_headers
      system_last: true
