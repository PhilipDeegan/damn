#! clean build test -p test_damn_core -dKO -t 8

name: damn

profile:

- name: base
  inc: inc
  self: cppdict phlop thread_pool
  dep: mkn.kul mkn.gpu
  arg: -std=c++20

- name: damn_core
  parent: base
  src: src/damn
       tpp/phlop/src/phlop/timing/scope_timer.cpp
       tpp/phlop/src/phlop/timing/common_threaded_timer.cpp
  out: damn_core

- name: test_damn_core
  inc: .
  self: damn_core
  dep: google.test
  mode: none
  test: tst/damn/core/test_damn_core.cpp

- name: cppdict
  sub: cppdict&tpp/cppdict(https://github.com/LaboratoryOfPlasmaPhysics/cppdict)
  inc: tpp/cppdict/include

- name: thread_pool
  sub: bto&tpp/bto(https://github.com/bshoshany/thread-pool)
  inc: tpp/bto/include

- name: phlop
  sub: phlop&tpp/phlop(https://github.com/PhilipDeegan/phlop)
  inc: tpp/phlop/inc
